# ============================================================
#   TARİF MOTORU - Eşya Sözlüğü
#
#   Oyuncu "çubuk nasıl yapılır" yazdığında bot cevap verir.
#
#   TARİFLER BU DOSYADA YAZMIYOR. Tarifler sunucunun kendi
#   kayıtlarından okunuyor (Bukkit.getRecipesFor), yani oyundaki
#   BÜTÜN tarifler otomatik olarak çalışıyor — vanilla, veri
#   paketi, başka eklentilerin eklediği tarifler dahil. Minecraft
#   güncellenince tarifler de kendiliğinden güncelleniyor.
#
#   Bu dosyanın tek işi TÜRKÇE AD EŞLEŞTİRMEK. Sunucu tarafında
#   eşyaların Türkçe adı yoktur; oyuncunun gördüğü "Çubuk" yazısı
#   istemcinin kendi dil dosyasından gelir, sunucu sadece STICK
#   bilir. Aşağıdaki liste o köprüyü kuruyor.
#
#   Listede olmayan eşya için bot susmaz: İngilizce adıyla da
#   eşleştirmeyi dener ("grindstone nasıl yapılır" çalışır).
#
#   Yeni ad eklemek: solda oyuncunun yazacağı Türkçe ad, sağda
#   Minecraft materyal adı. Türkçe karakter kullanabilirsin.
#   Değişiklikten sonra: /sohbetyardim reload
# ============================================================

ayarlar:
  acik: true

  # Cevapta en fazla kaç satır yazılsın (ızgara + açıklamalar dahil)
  en-fazla-satir: 10

  # Bu kalıplardan biri geçmezse eşya adı aranmaz bile.
  # Türkçe karakter yazabilirsin, eklenti kendi sadeleştirir.
  kaliplar:
    - "nasıl yapılır"
    - "nasıl yapılıyor"
    - "nasıl yapabilirim"
    - "nasıl yaparım"
    - "nasıl yapıcam"
    - "nasıl yapılıyo"
    - "nası yapılır"
    - "nası yapabilirim"
    - "nası yapılıyor"
    - "nasıl üretilir"
    - "nasıl craftlanır"
    - "nasıl craft"
    - "craftı nedir"
    - "tarifi nedir"
    - "tarifi ne"
    - "neyle yapılır"
    - "neyden yapılır"
    - "ne ile yapılır"

