# ============================================================
#   SOHBET YARDIMCISI - TEST DEFTERİ
#
#   Çalıştırmak için:  /sohbetyardim testler
#
#   BU DOSYA NEDEN VAR
#
#   Kelime listesine yapılan HER değişiklik 56 konunun tamamını
#   etkiliyor. Bir hatayı düzeltirken başka bir yerde yenisini
#   açmak bu sistemin en sık görülen davranışıydı ve kimse her
#   değişiklikten sonra 56 konuyu elle deneyemezdi.
#
#   Burada "şu cümle yazılırsa şu konu cevap vermeli" (ya da
#   "hiçbir konu cevap vermemeli") diye yazılmış örnekler duruyor.
#   Tek komutla hepsi çalışıyor.
#
#   KURAL: her düzeltilen hata için buraya bir satır eklenir.
#   Böylece aynı hata bir daha geri gelemez.
#
#   beklenen: yok   -> botun SUSMASI gerekir
#   beklenen: <id>  -> o konunun cevap vermesi gerekir
#
#   NOT: "oyuncuya hitap" süzgeci burada denenmez, çünkü o an
#   kimin çevrimiçi olduğuna bağlı ve test sonucu değişken olurdu.
#   Onu /sohbetyardim dene ile canlı sunucuda kontrol et.
# ============================================================

