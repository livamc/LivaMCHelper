  # ================= YENİ OYUNCU =================

  oyuna-baslama:
    # Bu konu SORU ŞARTI ARANMADAN tetiklenir: "knk yeni başladım"
    # bir soru değil ama tam da yardım edilmesi gereken an.
    # Bu yüzden bütün kökleri çok kelimeli ve çok özel tutuldu.
    soru-gerekmez: true
    # YEDEK KONU. "nasıl oynanır", "ne yapmalıyım" gibi geniş
    # kalıplarla çalıştığı için özel bir konu varken asla onun
    # önüne geçmemeli. -1 önceliği bunu garanti eder:
    # "jackpot nasıl oynanır" -> jackpot, "yeni başladım" -> bu konu.
    oncelik: -1
    aktif: true
    guclu: [yeni başladım, nereden başla, ilk ne yap, nasıl oynanır, oyuna başla, nasıl başla, yeni geldim]
    # "ne yapmalıyım" BİLEREK zayıf: "banlandım ne yapmalıyım",
    # "skinim görünmüyor ne yapmalıyım" gibi cümlelerde de geçiyor.
    # Güçlü olsaydı bu konu onların önüne geçerdi.
    zayif: [yeniyim, ne yapmalıyım, napıcam]
    yasak: [ban, ceza, skin, şikayet]
    cevap:
      - "&e/baslangic &frehberini aç, sonra &e/rtporman &file vahşi doğaya atla ve üssünü kur."
