# ============================================================
#   SOHBET YARDIMCISI - KONULAR
#
#   Bu dosya config.yml'den AYRI tutuluyor. Sebebi pratik:
#   config.yml Gemini API anahtarını ve Discord token'ını
#   tutuyor, o dosyanın üstüne yazmak istemiyoruz. Konu listesi
#   burada serbestçe güncellenebilir.
#
#   Değişiklikten sonra:  /sohbetyardim reload
#   Kontrol etmek için:   /sohbetyardim testler
# ============================================================


# ------------------------------------------------------------
#   PUANLAMA
#
#   Bir mesajın cevaplanması için sırayla şu süzgeçlerden
#   geçmesi gerekir. Herhangi biri kapalıysa bot SUSAR:
#
#     1. yasak kelime      konu tamamen elenir
#     2. yeterli sinyal    en az 1 GÜÇLÜ ya da en az 2 ZAYIF kelime
#     3. asgari puan       toplam puan eşiğin altındaysa susar
#     4. fark kuralı       kazanan ikinciyi belirgin geçmeli
#     5. soru şartı        mesaj soru olmalı
#
#   2. madde bu sistemin kalbi. Eskiden TEK bir kelimenin
#   tutması cevap vermeye yetiyordu ve şu hata oluyordu:
#
#     "overland setim nasıl kaplama yaptım"
#        -> 'nasıl' soru şartını geçti
#        -> 'kaplama' skin konusunda geçiyordu
#        -> bot skin cevabı verdi
#
#   Artık 'kaplama' ZAYIF bir kelime; tek başına asla yetmez.
#   Üstüne skin konusunda 'set' yasaklı, yani o cümle iki kez
#   eleniyor.
# ------------------------------------------------------------

puanlama:
  guclu: 3          # bir güçlü kelimenin getirdiği puan
  zayif: 1          # bir zayıf kelimenin getirdiği puan
  kalip-bonus: 1    # çok kelimeli kalıplara ek puan
  en-az-puan: 2     # bu puanın altı cevaplanmaz
  fark: 2           # kazanan, ikinciyi en az bu kadar geçmeli


# ------------------------------------------------------------
#   ENGELLEYİCİ KELİMELER
#
#   Oyuncular birbirine sürekli "kazma satar mısın", "kaça",
#   "veren var mı" diye yazıyor. Bunlar sunucuya sorulmuş soru
#   değil, oyuncular arası ticaret. İçinde konu kelimesi geçse
#   bile bu kalıplardan biri varsa eklenti HİÇ bakmaz.
#
#   NOT: "takas" bu listeden ÇIKARILDI. Sunucuda artık /takas
#   diye gerçek bir sistem var; kelimeyi engelleyici bırakmak
#   o konunun hiçbir zaman cevaplanamaması demekti.
# ------------------------------------------------------------

engelleyici-kelimeler:
  - "satar mısın"
  - "satarmısın"
  - "satar mısınız"
  - "satan var"
  - "satılık"
  - "alır mısın"
  - "alırmısın"
  - "alan var"
  - "veren var"
  - "verir misin"
  - "verirmisin"
  - "kaça"
  - "kaç para"
  - "kaç tl"
  - "ucuza"
  - "lazım olan"
  - "isteyen var"
  - "atar mısın"
  - "atarmısın"
  # Fiyat pazarlığı: "kaçtan satıyorsun", "kaç verirsin"
  - "kaçtan"
  - "*verirsin"
  - "piyasa"
  - "fiyatı"
  - "isteyen"
  - "atacak var"
  - "atabilecek var"
  - "atabilcek var"
  - "verecek var"
  - "vercek var"


# ------------------------------------------------------------
#   OYUNCUYA DÖNÜK SORULAR
#
#   "kaç seviyesin", "skinin çok güzel nerden aldın", "kasa
#   açtım ne çıktı sana" gibi mesajlar oyunculardan BİRBİRİNE
#   soruluyor. İçinde konu kelimesi geçtiği için bot araya
#   girip alakasız cevap veriyordu. Mesajda "sen/sana/sende"
#   ya da "aldın/oldun/buldun" gibi 2. tekil şahıs kelimeleri
#   varsa soru bota değil bir oyuncuyadır; bot susar.
#
#   Aynı şekilde "takım olalım mı", "takım kuralım mı" gibi
#   davetler de soru değil teklif.
# ------------------------------------------------------------

  - "=sen"
  - "=sana"
  - "=senin"
  - "=sende"
  - "=seni"
  - "*aldin"
  - "*oldun"
  - "*buldun"
  - "*yaptin"
  - "*kastin"
  - "*attin"
  - "*ciktin"
  - "*olalim"
  - "*lalim"
  - "*kuralim"
  - "=olak"
  - "=gidek"
  - "=yapak"


# ============================================================
#   KONULAR
#
#   guclu : Tek başına konuyu belirler. Başka anlama gelme
#           ihtimali yok denecek kadar az.
#
#   zayif : Konuya işaret eder ama tek başına yetmez. Günlük
#           dilde başka anlamda da kullanılabilir. Yanında
#           ikinci bir sinyal ister.
#
#   yasak : Bu kelime geçiyorsa konu TAMAMEN elenir. İki
#           konunun kesiştiği yerde hakemlik eder.
#
#   oncelik : Varsayılan 0. YEDEK konulara -1 verilir. Yüksek
#           öncelikli bir konu geçerli sayıldıysa, düşük öncelikli
#           olanlar hiç hesaba katılmaz. "oyuna-baslama" bunun
#           tek örneği: geniş kalıplarla çalışır, özel bir konu
#           varken onun önüne geçmemeli.
#
#   KÖK YAZMA KURALLARI
#   Türkçe ekli bir dil olduğu için kök uzunluğuna göre farklı
#   kural uygulanır:
#
#     6+ harf : kelimenin herhangi bir yerinde geçebilir
#     4-5 harf: kelime bu kökle BAŞLAMALI  (para -> parayı)
#     1-3 harf: TAM eşleşme şartı          (ah -> sadece "ah")
#
#   Kuralı elle zorlamak istersen:
#     "=kelime"  tam eşleşme şart
#     "*kelime"  içinde geçmesi yeter
#
#   Türkçe karakter yazabilirsin, eklenti kendi sadeleştirir.
#   CEVAP en fazla 2 satır olsun - sohbette okunacak.
# ============================================================

konular:

  # ================= EKONOMİ =================

  para-kazanma:
    aktif: true
    guclu: [para kazan, nasıl kazan, para yap, nasıl zengin, para kas, nasıl para, nası para, para nasıl, para nası]
    zayif: [para, kazanç, zengin, gelir, kasmak]
    # 'kristal' yasak: "kristal nasıl kazanılır" sorusu bu konuya
    # değil kristal konusuna ait. Yasak olmasaydı iki konu yakın
    # puan alır ve fark kuralı yüzünden ikisi de susardı.
    # 'para at...' yasakları: "para nasıl atılıyo" kazanma değil gönderme sorusu.
    # 'başına/kelle': ödül koyma sorusu. 'harca': harcama sorusu.
    yasak: [pay, yolla, gönder, transfer, kristal, para at, para ver, "*atil", "*atiy", "*atca", "*atar", "*atma", "*kastim", "*miyon", başına, kelle, harca]
    cevap:
      - "&fEn hızlı yol &e/gunlukgorev &fve &e/order &f— ikisi de sermaye istemez."
      - "&7Sonra &e/sell &fve &e/ah&7. Her gece 00:00'da seviyene göre maaş da alırsın."

  para-gonderme:
    aktif: true
    guclu: [para yolla, para gönder, para at, para nasıl at, para nası at, nasıl para at, nası para at, nasıl para ver, kişiye para, birine para, para transfer, paytoggle, nasıl yolla, nasıl gönder]
    zayif: [pay, yolla, gönder, para]
    # "kim bana para atar", "para atacak var mı" dilenme; cevaplanmaz.
    yasak: [kristal, "=bana", var mı, "*atayim", "*atic", "*atcak", "*attar", "*atmis"]
    cevap:
      - "&e/pay <oyuncu> <miktar> &file başka bir oyuncuya para gönderirsin."
